<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet", href="style.css">
</head>
<body>
    <div class="card" id="cardBG">
        
        <div class="search">
            <input class="searchBox" type ="text" placeholder="Enter city name" spellcheck="false">
            <button class="searchBtn"><img src="icon.png" alt="icon"> 
            </button>
        </div>
      
        <div class="weather">
            <img  class="weatherimg" src="">
            <br><br>
            <h3 class="weatherType">
                
            </h3> 
            <br>
            <h1 class="temp">
                
            </h1>
            <br>
            <h2 class="city">
                
            </h2>
            <div class="details">
                <div class="col">
                    <img src="humidity.png">
                    <p>Humidity</p>
                    <div class="humidity">
                    </div>
                   
                    </div>
                    <div class="col">
                        <img src="wind.png">
                        <p>Wind Speed</p>
                        <div class="wind">
                        
                        </div>
                        
                   </div>

                </div>
            </div>
        </div>
    </div>



    <script src="script.js">
    
    </script>
</body>
</html>
